# Jupyter Book configuration: https://jupyterbook.org/en/stable/customize/config.html
title: Mathematics for AI
author: Instructor Name
copyright: "2026"
logo: ""

only_build_toc_files: true

execute:
  execute_notebooks: force     # run every notebook on each build: the site always shows fresh outputs
  timeout: 300
  allow_errors: false

parse:
  myst_enable_extensions:
    - dollarmath
    - amsmath
    - colon_fence
    - html_image

repository:
  url: https://github.com/YOUR-GITHUB-USERNAME/math-for-ai
  branch: main

html:
  use_repository_button: true
  use_issues_button: true
  home_page_in_navbar: true

launch_buttons:
  notebook_interface: jupyterlab
  colab_url: "https://colab.research.google.com"

sphinx:
  config:
    html_show_copyright: false
